<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Portal</title>
</head>
<body>
  <h1>Admin Portal</h1>
  <section>
    <h2>Login</h2>
    <input id="username" placeholder="username" value="admin" />
    <input id="password" placeholder="password" type="password" value="adminpass" />
    <button onclick="login()">Login</button>
    <p id="login-status"></p>
  </section>
  <section>
    <h2>Users</h2>
    <button onclick="loadUsers()">Load Users</button>
    <pre id="user-list"></pre>
    <h3>Create User</h3>
    <input id="newUser" placeholder="username" />
    <input id="newPass" placeholder="password" />
    <input id="newRole" placeholder="role (civ/dispatch/police/admin)" />
    <button onclick="createUser()">Create</button>
  </section>
  <section>
    <h2>Call Types</h2>
    <button onclick="loadTypes()">Load Types</button>
    <pre id="type-list"></pre>
    <input id="newType" placeholder="new call type" />
    <button onclick="addType()">Add</button>
  </section>
  <section>
    <h2>System Config</h2>
    <button onclick="loadConfig()">Load Config</button>
    <pre id="config"></pre>
    <input id="agencyName" placeholder="Agency Name" />
    <label><input id="allowSelf" type="checkbox" /> Allow Self Assign</label>
    <button onclick="saveConfig()">Save Config</button>
  </section>
  <script>
    let token = '';
    async function login() {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username.value, password: password.value })
      });
      const data = await res.json();
      if (res.ok) { token = data.token; loginStatus.textContent = `Logged in as ${data.role}`; }
      else { loginStatus.textContent = data.error; }
    }
    async function loadUsers() {
      const res = await fetch('/admin/users', { headers: { 'x-auth-token': token } });
      const data = await res.json();
      userList.textContent = JSON.stringify(data, null, 2);
    }
    async function createUser() {
      const res = await fetch('/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
        body: JSON.stringify({ username: newUser.value, password: newPass.value, role: newRole.value })
      });
      const data = await res.json();
      alert(JSON.stringify(data));
      loadUsers();
    }
    async function loadTypes() {
      const res = await fetch('/admin/call-types', { headers: { 'x-auth-token': token } });
      const data = await res.json();
      typeList.textContent = JSON.stringify(data, null, 2);
    }
    async function addType() {
      const res = await fetch('/admin/call-types', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
        body: JSON.stringify({ type: newType.value })
      });
      const data = await res.json();
      alert(JSON.stringify(data));
      loadTypes();
    }
    async function loadConfig() {
      const res = await fetch('/admin/config', { headers: { 'x-auth-token': token } });
      const data = await res.json();
      config.textContent = JSON.stringify(data, null, 2);
      agencyName.value = data.agencyName || '';
      allowSelf.checked = data.allowSelfAssign;
    }
    async function saveConfig() {
      const res = await fetch('/admin/config', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
        body: JSON.stringify({ agencyName: agencyName.value, allowSelfAssign: allowSelf.checked })
      });
      const data = await res.json();
      alert(JSON.stringify(data));
      loadConfig();
    }
  </script>
</body>
</html>
