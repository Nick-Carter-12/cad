<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Police Portal</title>
</head>
<body>
  <h1>Police Portal</h1>
  <section>
    <h2>Login</h2>
    <input id="username" placeholder="username" value="police" />
    <input id="password" placeholder="password" type="password" value="policepass" />
    <button onclick="login()">Login</button>
    <p id="login-status"></p>
  </section>
  <section>
    <h2>My Assigned Calls</h2>
    <button onclick="loadCalls()">Refresh</button>
    <pre id="call-list"></pre>
  </section>
  <section>
    <h2>Update Call Status</h2>
    <input id="callId" placeholder="Call ID" />
    <select id="status">
      <option>En-Route</option>
      <option>On-Scene</option>
      <option>Clear</option>
    </select>
    <button onclick="updateStatus()">Update</button>
  </section>
  <script>
    let token = '';
    const els = {
      username: document.getElementById('username'),
      password: document.getElementById('password'),
      loginStatus: document.getElementById('login-status'),
      callList: document.getElementById('call-list'),
      callId: document.getElementById('callId'),
      status: document.getElementById('status'),
    };
    async function login() {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: els.username.value, password: els.password.value })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        els.loginStatus.textContent = 'Logged in as ' + data.role;
      } else {
        els.loginStatus.textContent = data.error || 'Login failed';
      }
    }
    async function loadCalls() {
      const res = await fetch('/police/calls', { headers: { 'x-auth-token': token } });
      const data = await res.json();
      els.callList.textContent = JSON.stringify(data, null, 2);
    }
    async function updateStatus() {
      const res = await fetch('/police/calls/' + els.callId.value + '/status', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
        body: JSON.stringify({ status: els.status.value })
      });
      const data = await res.json();
      await loadCalls();
      alert(JSON.stringify(data));
    }
  </script>
</body>
</html>
