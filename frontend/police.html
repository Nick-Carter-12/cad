<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Police Portal</title>
</head>
<body>
  <h1>Police Portal</h1>
  <section>
    <h2>Login</h2>
    <input id="username" placeholder="username" value="police" />
    <input id="password" placeholder="password" type="password" value="policepass" />
    <button onclick="login()">Login</button>
    <p id="login-status"></p>
  </section>
  <section>
    <h2>My Assigned Calls</h2>
    <button onclick="loadCalls()">Refresh</button>
    <pre id="call-list"></pre>
  </section>
  <section>
    <h2>Update Call Status</h2>
    <input id="callId" placeholder="Call ID" />
    <select id="status">
      <option>En-Route</option>
      <option>On-Scene</option>
      <option>Clear</option>
    </select>
    <button onclick="updateStatus()">Update</button>
  </section>
  <script>
    let token = '';
    async function login() {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username.value, password: password.value })
      });
      const data = await res.json();
      if (res.ok) { token = data.token; loginStatus.textContent = `Logged in as ${data.role}`; }
      else { loginStatus.textContent = data.error; }
    }
    async function loadCalls() {
      const res = await fetch('/police/calls', { headers: { 'x-auth-token': token } });
      const data = await res.json();
      callList.textContent = JSON.stringify(data, null, 2);
    }
    async function updateStatus() {
      const res = await fetch(`/police/calls/${callId.value}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
        body: JSON.stringify({ status: status.value })
      });
      const data = await res.json();
      loadCalls();
      alert(JSON.stringify(data));
    }
  </script>
</body>
</html>
