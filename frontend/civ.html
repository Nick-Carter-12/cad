<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Civilian Portal</title>
</head>
<body>
  <h1>Civilian Portal</h1>
  <section>
    <h2>Login</h2>
    <input id="username" placeholder="username" value="civ" />
    <input id="password" placeholder="password" type="password" value="civpass" />
    <button onclick="login()">Login</button>
    <p id="login-status"></p>
  </section>
  <section>
    <h2>Submit Call for Service</h2>
    <input id="type" placeholder="Call Type" />
    <input id="description" placeholder="Description" />
    <input id="location" placeholder="Location" />
    <button onclick="submitCall()">Submit</button>
    <pre id="call-output"></pre>
  </section>
  <script>
    let token = '';
    const els = {
      username: document.getElementById('username'),
      password: document.getElementById('password'),
      loginStatus: document.getElementById('login-status'),
      type: document.getElementById('type'),
      description: document.getElementById('description'),
      location: document.getElementById('location'),
      callOutput: document.getElementById('call-output'),
    };
    async function login() {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: els.username.value, password: els.password.value })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        els.loginStatus.textContent = 'Logged in as ' + data.role;
      } else {
        els.loginStatus.textContent = data.error || 'Login failed';
      }
    }
    async function submitCall() {
      const res = await fetch('/civ/calls', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
        body: JSON.stringify({
          type: els.type.value,
          description: els.description.value,
          location: els.location.value
        })
      });
      const data = await res.json();
      els.callOutput.textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
